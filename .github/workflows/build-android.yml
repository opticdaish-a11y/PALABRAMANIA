name: Compilar Android APK y AAB (Pantalla Completa)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android.yml'
      - 'manifest.json'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android Build-Tools y Licencias
        run: |
          SDK_MGR=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | $SDK_MGR --licenses || true
          $SDK_MGR "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Generar Keystore y AssetLinks SHA-256
        run: |
          mkdir -p /tmp/twa-build/android
          keytool -genkeypair -v \
            -keystore /tmp/twa-build/palabramania.keystore \
            -alias palabramania \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass PalabraMania2026! \
            -keypass PalabraMania2026! \
            -dname "CN=PalabraMania, OU=Mobile, O=OpticDaish, L=Managua, S=Managua, C=NI"

          SHA256=$(keytool -list -v -keystore /tmp/twa-build/palabramania.keystore -alias palabramania -storepass PalabraMania2026! | grep "SHA256:" | sed 's/.*SHA256: //')
          echo "SHA256=$SHA256"

          cat <<EOF > /tmp/twa-build/assetlinks.json
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.github.opticdaish.palabramania",
              "sha256_cert_fingerprints": ["$SHA256"]
            }
          }]
          EOF

      - name: Generar Proyecto Android TWA (Fullscreen Sticky)
        run: |
          cd /tmp/twa-build
          npm init -y
          npm install @bubblewrap/core

          cat <<'EOF' > generate.mjs
          import { TwaGenerator, TwaManifest, ConsoleLog } from '@bubblewrap/core';

          const manifestData = {
            packageId: 'io.github.opticdaish.palabramania',
            host: 'opticdaish-a11y.github.io',
            name: 'PalabraMania',
            launcherName: 'PalabraMania',
            display: 'fullscreen-sticky',
            themeColor: '#0F172A',
            themeColorDark: '#0F172A',
            navigationColor: '#0F172A',
            navigationColorDark: '#0F172A',
            navigationDividerColor: '#0F172A',
            navigationDividerColorDark: '#0F172A',
            backgroundColor: '#0F172A',
            enableNotifications: false,
            startUrl: '/PALABRAMANIA/index.html',
            iconUrl: 'https://opticdaish-a11y.github.io/PALABRAMANIA/icon-512.png',
            maskableIconUrl: 'https://opticdaish-a11y.github.io/PALABRAMANIA/icon-512.png',
            splashScreenFadeOutDuration: 300,
            signingKey: {
              path: '/tmp/twa-build/palabramania.keystore',
              alias: 'palabramania'
            },
            appVersionName: '1.0.0',
            appVersionCode: 1,
            shortcuts: [],
            generatorApp: 'bubblewrap-core',
            webManifestUrl: 'https://opticdaish-a11y.github.io/PALABRAMANIA/manifest.json',
            fallbackType: 'customtabs',
            features: {},
            alphaDependencies: { enabled: false },
            enableSiteSettingsShortcut: true,
            isChromeOSOnly: false,
            isMetaQuest: false,
            fullScopeUrl: 'https://opticdaish-a11y.github.io/PALABRAMANIA/',
            minSdkVersion: 24,
            orientation: 'portrait',
            fingerprints: [],
            appVersion: '1.0.0'
          };

          const twaManifest = new TwaManifest(manifestData);
          const generator = new TwaGenerator();
          await generator.createTwaProject('/tmp/twa-build/android', twaManifest, new ConsoleLog('twa'));
          console.log('Proyecto TWA generado correctamente.');
          EOF

          node generate.mjs

      - name: Compilar APK y AAB Firmados
        run: |
          cd /tmp/twa-build/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDK_MGR=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          COMPILE_SDK=$(grep -oE 'compileSdk(Version)?\s*=?\s*[0-9]+' app/build.gradle | grep -oE '[0-9]+' | head -n 1 || echo "35")
          echo "Detected compileSdk: $COMPILE_SDK"
          yes | $SDK_MGR --licenses || true
          $SDK_MGR "platforms;android-$COMPILE_SDK" "build-tools;${COMPILE_SDK}.0.0" || true

          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/twa-build/palabramania.keystore \
            -Pandroid.injected.signing.store.password=PalabraMania2026! \
            -Pandroid.injected.signing.key.alias=palabramania \
            -Pandroid.injected.signing.key.password=PalabraMania2026!

          mkdir -p /tmp/twa-build/output
          APK_FILE=$(find app/build/outputs -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs -name "*.aab" | head -n 1)
          cp "$APK_FILE" /tmp/twa-build/output/PalabraMania-fullscreen.apk
          cp "$AAB_FILE" /tmp/twa-build/output/PalabraMania-playstore.aab
          cp /tmp/twa-build/assetlinks.json /tmp/twa-build/output/assetlinks.json
          cp /tmp/twa-build/palabramania.keystore /tmp/twa-build/output/palabramania.keystore

      - name: Subir APK, AAB y AssetLinks como Descarga
        uses: actions/upload-artifact@v4
        with:
          name: PalabraMania-Android-Fullscreen
          path: /tmp/twa-build/output/*
